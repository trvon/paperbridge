name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Weekly run so newly published advisories fail CI without a code change.
  schedule:
    - cron: "17 6 * * 1"
  # Validate intermediate PR bases in dependency stacks as well as main.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_VERSION: "1.98.0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@d188fec832a53ccc1d60b19754dd398708da38e9 # cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo deny
        run: cargo deny check advisories bans sources

      - name: Check test compilation
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Check benchmarks compile
        run: cargo bench --workspace --locked --no-run

      - uses: taiki-e/install-action@562f912bf8a1174eb1007c4afe216a9187a8d722 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only \
            --fail-under-lines 70 \
            | tee coverage-summary.txt

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn
          retention-days: 7
