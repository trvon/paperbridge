name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.98.0"

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            npm_pkg: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            npm_pkg: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            npm_pkg: linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            npm_pkg: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="paperbridge-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C target/${{ matrix.target }}/release paperbridge
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "paperbridge-${{ needs.release-please.outputs.tag_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/paperbridge.exe" -DestinationPath $archive
          echo "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage npm binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/paperbridge npm/${{ matrix.npm_pkg }}/

      - name: Stage npm binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/paperbridge.exe" "npm/${{ matrix.npm_pkg }}/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.npm_pkg }}
          path: npm/${{ matrix.npm_pkg }}/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          pattern: archive-*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            *.tar.gz
            *.zip
          overwrite_files: true
          fail_on_unmatched_files: true

  npm-publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
          registry-url: "https://registry.npmjs.org"

      - name: Set version
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: npm-artifacts

      - name: Prepare and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for pkg_dir in npm-artifacts/npm-*/; do
            pkg_name=$(basename "$pkg_dir" | sed 's/^npm-//')
            binary_name=paperbridge
            if [ "$pkg_name" = "win32-x64" ]; then
              binary_name=paperbridge.exe
            fi
            source_binary="${pkg_dir}${binary_name}"
            if [ ! -f "$source_binary" ]; then
              echo "Missing expected binary: $source_binary" >&2
              exit 1
            fi

            cp "$source_binary" "npm/$pkg_name/$binary_name"
            if [ "$pkg_name" != "win32-x64" ]; then
              chmod +x "npm/$pkg_name/paperbridge"
            fi

            cd "npm/$pkg_name"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            package_name=$(node -p "require('./package.json').name")
            npm pack --dry-run
            if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${package_name}@${VERSION} is already published; skipping"
            else
              npm publish --access public
            fi
            cd ../..
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/paperbridge
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const pkg = require('./package.json');
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${{ env.VERSION }}';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm pack --dry-run
          package_name=$(node -p "require('./package.json').name")
          if npm view "${package_name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${package_name}@${VERSION} is already published; skipping"
          else
            npm publish --access public
          fi
