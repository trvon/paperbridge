name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  # Validate intermediate PR bases in dependency stacks as well as main.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_VERSION: "1.98.0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@d188fec832a53ccc1d60b19754dd398708da38e9 # cargo-deny
        with:
          tool: cargo-deny@0.20.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Cargo deny
        run: cargo deny check advisories bans sources

      - name: Check test compilation
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - uses: taiki-e/install-action@562f912bf8a1174eb1007c4afe216a9187a8d722 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only \
            --fail-under-lines 70 \
            | tee coverage-summary.txt

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn
          retention-days: 7
