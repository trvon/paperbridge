name: Formal (full)

permissions:
  contents: read

on:
  # The large TLC configs (_Split, _Undo2) take several minutes; run them
  # nightly and on demand. Pull requests run the fast set in ci.yml.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  formal-full:
    name: TLA+ (MergeFetchDecide, full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Model check (all configs)
        env:
          TLC_WORKERS: auto
          TLA_FULL: "1"
        run: formal/tla/run.sh
